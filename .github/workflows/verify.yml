name: verify-solver
on:
  push:
    paths: ["solver/**", "verify/**", "graphs/**", "evaluation/**", "data/generate.py", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["solver/**", "verify/**", "graphs/**", "evaluation/**", "data/generate.py", ".github/workflows/verify.yml"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.24" "scipy>=1.10" "h5py>=3.8"
      - run: python -m verify.run_all