name: verify-solver
on:
  push:
    paths: ["solver/**", "verify/**", ".github/workflows/verify.yml"]
  pull_request:
    paths: ["solver/**", "verify/**"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "numpy>=1.24" "scipy>=1.10"
      - run: python -m verify.run_all
